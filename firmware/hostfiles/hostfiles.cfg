# ld65 configuration for the host file transfer card's firmware ROM.
# Output layout: 256 bytes for the card's own $Cn00 page, then 2K
# expansion ROM banks, each mapped at $C800-$CFFF when selected through
# the card's register $3:
#   bank 0 -- detection, borrowing RAM, messages
#   bank 1 -- the ProDOS agent image, copied to and run at $0800
MEMORY {
    SLOTPAGE: start = $C100, size = $0100, fill = yes, fillval = $00, file = %O;
    BANK0:    start = $C800, size = $0800, fill = yes, fillval = $FF, file = %O;
    BANK1:    start = $C800, size = $0800, fill = yes, fillval = $FF, file = %O;
    AGENTRAM: start = $0800, size = $0800, file = "";
}
SEGMENTS {
    SLOT:  load = SLOTPAGE, type = ro;
    MAIN:  load = BANK0, type = ro;
    AGENT: load = BANK1, run = AGENTRAM, type = rw, define = yes;
}
