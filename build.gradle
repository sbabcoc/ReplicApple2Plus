buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.sonatype.plexus:plexus-sec-dispatcher:1.4'
        classpath 'org.codehaus.plexus:plexus-container-default:2.1.1'
        classpath 'org.sonatype.plexus:plexus-cipher:1.7'
    }
}

import groovy.xml.XmlParser
import org.sonatype.plexus.components.sec.dispatcher.DefaultSecDispatcher
import org.sonatype.plexus.components.cipher.DefaultPlexusCipher

plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'signing'

    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'pl.allegro.tech.build.axion-release' version '1.18.16'
    id 'org.beryx.runtime' version '1.12.7'
}

group = 'com.nordstrom.ui-tools'
description = 'ReplicApple2Plus'

/* Repositories */
repositories {
    mavenLocal()
    mavenCentral()
}

/*
 * Credential lookup, identical in spirit and mechanism to the pattern
 * used across Scott's other Java projects (e.g. selenium-grid-manager):
 * reads ~/.m2/settings.xml, decrypting any encrypted value found there
 * via ~/.m2/settings-security.xml, so no credentials ever need to live
 * in this file or in plaintext in a shell history.
 */
def getMavenServer(String serverId) {
    def settingsFile = new File(System.getProperty("user.home"), ".m2/settings.xml")
    if (!settingsFile.exists()) return null

    def settings = new XmlParser().parse(settingsFile)
    def server = settings.servers.server.find { it.id.text() == serverId }

    if (server) {
        def dispatcher = new DefaultSecDispatcher()
        dispatcher._cipher = new DefaultPlexusCipher()

        def securityFile = new File(System.getProperty("user.home"), ".m2/settings-security.xml")
        System.setProperty("settings.security", securityFile.absolutePath)

        def decrypt = { String val ->
            if (val == null) return null
            return dispatcher._cipher.isEncryptedString(val) ? dispatcher.decrypt(val) : val
        }

        return [
            username  : server.username?.text(),
            password  : decrypt(server.password?.text()),
            passphrase: decrypt(server.passphrase?.text())
        ]
    }

    return null
}

scmVersion {
    tag {
        prefix = 'v'
    }
    repository {
        def githubNode = getMavenServer('github')
        if (githubNode) {
            customUsername.set(githubNode.username)
            customPassword.set(githubNode.password)
        }
    }
}

/*
 * Version resolution: prefers an explicitly-supplied artifactVersion
 * property over the git-tag-derived scmVersion. Not currently exercised
 * by anything in this project (there is no bare, tag-less distribution
 * to build from yet), but this is the same fallback selenium-grid-manager
 * relies on for exactly that situation, so it's included now rather than
 * discovered as a gap later if one is ever built.
 */
def resolvedVersion = project.hasProperty('artifactVersion')
        ? project.property('artifactVersion').toString()
        : scmVersion.version
version = resolvedVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

application {
    // adjust once the CPU/bus/scheduler classes have a real entry point
    mainClass = 'com.nordstrom.emulator.Apple2Plus'
}

/*
 * Packaging: org.beryx.runtime, NOT org.beryx.jlink. This project has no
 * module-info.java anywhere -- and shouldn't get one, since the dynamic
 * plugin-loading architecture (PluginLoader, CardTypes) depends on open
 * class loading that JPMS's strict module boundaries actively work
 * against. org.beryx.jlink targets fully modularized applications;
 * org.beryx.runtime is the sibling plugin built specifically for
 * non-modular ones, and still produces real jlink runtime images and
 * jpackage installers -- see badass-runtime-plugin.beryx.org.
 *
 * jpackage cannot cross-build: running it produces an installer only
 * for the platform it runs on (.deb/.rpm on Linux, .msi/.exe on
 * Windows, .dmg/.pkg on macOS) -- there is no way to build all three
 * from one machine. Run `./gradlew jpackage` separately on each
 * platform.
 */

/*
 * jpackage's --app-version has real, platform-specific format
 * restrictions -- Windows MSI versioning in particular expects a plain
 * numeric x.y.z(.w) form and rejects a SemVer suffix like "-SNAPSHOT"
 * outright. resolvedVersion legitimately carries that suffix before the
 * first tagged release, so it is NOT safe to pass to jpackage directly
 * -- this is the actual current state of this project, not a
 * hypothetical one. Stripping at the first '-' keeps the numeric part
 * jpackage accepts everywhere; falling back to "0.0.1" (jpackage
 * rejects an all-zero version) covers the case where resolvedVersion
 * doesn't start with a digit at all.
 */
def jpackageSafeVersion = (resolvedVersion =~ /^\d[\d.]*/).with { it.find() ? it.group() : '0.0.1' }

runtime {
    modules = ['java.desktop'] // Swing; re-run the suggestModules task if new JDK APIs are added later
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']

    jpackage {
        imageName = 'ReplicApple2Plus'
        installerName = 'ReplicApple2Plus'
        appVersion = jpackageSafeVersion
        installerOptions = ['--vendor', 'Scott Babcock']
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Implementation-Version': resolvedVersion
        )
    }
}

/* Run CardCatalog task -- lists available SlotCard peripheral types.
 *
 * Modeled directly on selenium-grid-manager's runGrid task
 * (github.com/sbabcoc/selenium-grid-manager, grid.gradle): a JavaExec
 * task whose classpath is assembled dynamically from a Gradle property,
 * rather than requiring a hand-typed `java -cp` invocation.
 *
 * Usage:
 *   ./gradlew runCardCatalog
 *   ./gradlew runCardCatalog -PpluginsDir=plugins/
 */
tasks.register('runCardCatalog', JavaExec) {
    group = 'Application'
    description = 'List available SlotCard peripheral types, including any plugin jars'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nordstrom.emulator.system.CardCatalog'

    if (project.hasProperty('pluginsDir')) {
        args '--plugins', project.getProperty('pluginsDir')
    }
}

/* Run SlotConfigTemplate task -- generates a one-time starter slot
 * configuration file. See SlotConfigTemplate's own Javadoc for why this
 * is a snapshot, not a live or auto-synced catalog.
 *
 * Usage:
 *   ./gradlew runSlotConfigTemplate
 *   ./gradlew runSlotConfigTemplate -PpluginsDir=plugins/
 *   ./gradlew runSlotConfigTemplate -PoutputFile=slots.ini
 *   ./gradlew runSlotConfigTemplate -PpluginsDir=plugins/ -PoutputFile=slots.ini
 */
tasks.register('runSlotConfigTemplate', JavaExec) {
    group = 'Application'
    description = 'Generate a one-time starter slot configuration file listing available SlotCard peripheral types'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nordstrom.emulator.system.SlotConfigTemplate'

    def taskArgs = []
    if (project.hasProperty('pluginsDir')) {
        taskArgs += ['--plugins', project.getProperty('pluginsDir')]
    }
    if (project.hasProperty('outputFile')) {
        taskArgs += ['--output', project.getProperty('outputFile')]
    }
    args taskArgs
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// PROM/ROM binary assets (system ROMs, P5/P6 disk controller tables) live
// under src/main/resources and are loaded at runtime, not compiled in --
// keeping them out of source control as binaries is a separate decision;
// see .gitignore.

/* Publishing */
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'ReplicApple2Plus'
                groupId = project.group
                artifactId = rootProject.name
                version = resolvedVersion
                packaging = 'jar'
                description = 'A from-scratch Apple II+ emulator, written in Java, prioritizing ' +
                    'hardware fidelity over performance -- verified against real-world reference ' +
                    'test suites rather than taken on faith.'
                url = 'https://github.com/sbabcoc/ReplicApple2Plus'

                scm {
                    connection = 'scm:git:https://github.com/sbabcoc/ReplicApple2Plus.git'
                    developerConnection = 'scm:git:https://github.com/sbabcoc/ReplicApple2Plus.git'
                    url = 'https://github.com/sbabcoc/ReplicApple2Plus/tree/main'
                    tag = 'HEAD'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'scoba'
                        name = 'Scott Babcock'
                        email = 'scoba@hotmail.com'
                        organization = 'Nordstrom'
                        organizationUrl = 'https://shop.nordstrom.com'
                    }
                }
            }
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
}

/* Signing */
signing {
    if (project.hasProperty('signing.keyId')) {
        def keyId = project.getProperty('signing.keyId')
        def gpgNode = getMavenServer(keyId)
        def secret = gpgNode?.passphrase

        if (secret) {
            useGpgCmd()
            project.ext.set("signing.gnupg.passphrase", secret)
            project.ext.set("signing.gnupg.arguments", "--batch,--pinentry-mode,loopback")
        }
    }
    sign publishing.publications.mavenJava
}

/* Install alias */
tasks.register('install') {
    dependsOn tasks.named('publishToMavenLocal')
    group = tasks.named('publishToMavenLocal').get().group
    description = "[alias] publish to Maven Local"
}

/* Nexus publishing */
nexusPublishing {
    packageGroup = 'com.nordstrom'
    repositories {
        ossrh {
            def ossrhNode = getMavenServer('ossrh')
            username = ossrhNode?.username
            password = ossrhNode?.password
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/"))
            if (project.hasProperty('ossrhStagingProfileId')) {
                stagingProfileId = ossrhStagingProfileId
            }
        }
    }
}
