buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.sonatype.plexus:plexus-sec-dispatcher:1.4'
        classpath 'org.codehaus.plexus:plexus-container-default:2.1.1'
        classpath 'org.sonatype.plexus:plexus-cipher:1.7'
    }
}

import groovy.xml.XmlParser
import org.sonatype.plexus.components.sec.dispatcher.DefaultSecDispatcher
import org.sonatype.plexus.components.cipher.DefaultPlexusCipher

plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'signing'

    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'pl.allegro.tech.build.axion-release' version '1.18.16'
}

group = 'com.nordstrom.ui-tools'
description = 'ReplicApple2Plus'

/* Repositories */
repositories {
    mavenLocal()
    mavenCentral()
}

/*
 * Credential lookup, identical in spirit and mechanism to the pattern
 * used across Scott's other Java projects (e.g. selenium-grid-manager):
 * reads ~/.m2/settings.xml, decrypting any encrypted value found there
 * via ~/.m2/settings-security.xml, so no credentials ever need to live
 * in this file or in plaintext in a shell history.
 */
def getMavenServer(String serverId) {
    def settingsFile = new File(System.getProperty("user.home"), ".m2/settings.xml")
    if (!settingsFile.exists()) return null

    def settings = new XmlParser().parse(settingsFile)
    def server = settings.servers.server.find { it.id.text() == serverId }

    if (server) {
        def dispatcher = new DefaultSecDispatcher()
        dispatcher._cipher = new DefaultPlexusCipher()

        def securityFile = new File(System.getProperty("user.home"), ".m2/settings-security.xml")
        System.setProperty("settings.security", securityFile.absolutePath)

        def decrypt = { String val ->
            if (val == null) return null
            return dispatcher._cipher.isEncryptedString(val) ? dispatcher.decrypt(val) : val
        }

        return [
            username  : server.username?.text(),
            password  : decrypt(server.password?.text()),
            passphrase: decrypt(server.passphrase?.text())
        ]
    }

    return null
}

scmVersion {
    tag {
        prefix = 'v'
    }
    repository {
        def githubNode = getMavenServer('github')
        if (githubNode) {
            customUsername.set(githubNode.username)
            customPassword.set(githubNode.password)
        }
    }
}

/*
 * Version resolution: prefers an explicitly-supplied artifactVersion
 * property over the git-tag-derived scmVersion. Not currently exercised
 * by anything in this project (there is no bare, tag-less distribution
 * to build from yet), but this is the same fallback selenium-grid-manager
 * relies on for exactly that situation, so it's included now rather than
 * discovered as a gap later if one is ever built.
 */
def resolvedVersion = project.hasProperty('artifactVersion')
        ? project.property('artifactVersion').toString()
        : scmVersion.version
version = resolvedVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

application {
    mainClass = 'com.nordstrom.emulator.Apple2Plus'
}

/*
 * The ROM images are copyrighted firmware -- Apple's and Videx's -- so
 * they're kept out of everything this build publishes, though a local copy
 * under src/main/resources still serves `./gradlew run` and the tests.
 * A released build reads them from the directory named by --roms (RomFiles).
 * The card firmware this project assembles itself ships as usual.
 */
def thirdPartyRoms = ['**/system-rom.rom', '**/character-rom.rom', '**/integer-basic-firmware-card.rom',
                      '**/videx-videoterm-*.rom']
tasks.named('jar') {
    exclude thirdPartyRoms
}
tasks.named('sourcesJar') {
    exclude thirdPartyRoms
}

/*
 * Packaging, with the JDK's own jlink and jpackage, from the Java toolchain
 * this project builds with. (It used the org.beryx.runtime plugin until
 * Gradle 9, which removed the Project.exec() method every release of that
 * plugin calls.)
 *
 * The application is deliberately not modular -- no module-info.java --
 * since plugin loading (PluginLoader, CardTypes) depends on open class
 * loading that JPMS's module boundaries restrict. jlink builds the
 * minimal runtime from the JDK's own modules alone; the app's jars go
 * beside it on the class path.
 *
 *   runtime        the minimal runtime image, build/image-runtime
 *   jpackageImage  the application image, in build/jpackage
 *   jpackage       the platform's installer, in build/jpackage:
 *                  .dmg on macOS, .msi on Windows (needs the WiX
 *                  toolset), .deb or .rpm on Linux; the Windows and
 *                  Linux installers add a menu entry, and Windows a
 *                  desktop shortcut
 *
 * jpackage cannot cross-build: each installer is built on its own
 * platform, by running `./gradlew jpackage` there.
 */

/*
 * jpackage's --app-version has real, platform-specific format
 * restrictions -- Windows MSI versioning in particular expects a plain
 * numeric x.y.z(.w) form and rejects a SemVer suffix like "-SNAPSHOT"
 * outright. resolvedVersion carries that suffix between releases, so it
 * is NOT safe to pass to jpackage directly. Stripping at the first '-'
 * keeps the numeric part jpackage accepts everywhere; falling back to
 * "0.0.1" (jpackage rejects an all-zero version) covers the case where
 * resolvedVersion doesn't start with a digit at all.
 */
def jpackageSafeVersion = (resolvedVersion =~ /^\d[\d.]*/).with { it.find() ? it.group() : '0.0.1' }

def appName = 'ReplicApple2Plus'
def appVendor = 'Scott Babcock'
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def onWindows = osName.contains('win')
def onMac = osName.contains('mac')

// Swing, and java.util.prefs for the remembered folders and ROM folder.
// If new JDK APIs are used, `jdeps --print-module-deps` on the classes
// lists what this needs.
def runtimeModules = ['java.desktop', 'java.prefs']

def runtimeImageDir = layout.buildDirectory.dir('image-runtime')
def jpackageDir = layout.buildDirectory.dir('jpackage')

/** A JDK tool from this project's Java toolchain, e.g. 'jlink'. */
def jdkTool = { String name ->
    def home = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath
    home.file("bin/${name}${onWindows ? '.exe' : ''}").asFile.absolutePath
}

tasks.register('cleanRuntime', Delete) {
    delete runtimeImageDir // jlink won't write over an existing image
}

tasks.register('runtime', Exec) {
    group = 'distribution'
    description = 'Builds a minimal Java runtime for the application with jlink.'
    dependsOn 'cleanRuntime'
    outputs.dir runtimeImageDir
    doFirst {
        commandLine jdkTool('jlink'),
            '--add-modules', runtimeModules.join(','),
            '--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages',
            '--output', runtimeImageDir.get().asFile.absolutePath
    }
}

tasks.register('cleanJpackage', Delete) {
    delete jpackageDir // jpackage won't write over an existing image or installer
}

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Builds the application image -- the app and its runtime -- with jpackage.'
    dependsOn 'runtime', 'installDist', 'cleanJpackage'
    outputs.dir jpackageDir
    doFirst {
        commandLine jdkTool('jpackage'), '--type', 'app-image',
            '--name', appName, '--app-version', jpackageSafeVersion, '--vendor', appVendor,
            '--input', layout.buildDirectory.dir("install/${project.name}/lib").get().asFile.absolutePath,
            '--main-jar', tasks.named('jar', Jar).get().archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--runtime-image', runtimeImageDir.get().asFile.absolutePath,
            '--dest', jpackageDir.get().asFile.absolutePath
    }
}

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = "Builds this platform's installer from the application image with jpackage."
    dependsOn 'jpackageImage'
    doFirst {
        def appImage = jpackageDir.get().file(onMac ? "${appName}.app" : appName).asFile.absolutePath
        def command = [jdkTool('jpackage'), '--app-image', appImage,
            '--name', appName, '--app-version', jpackageSafeVersion, '--vendor', appVendor,
            '--dest', jpackageDir.get().asFile.absolutePath]
        // A Start-menu entry and a desktop shortcut on Windows, and a desktop
        // menu entry on Linux; jpackage adds none unless asked. macOS has the
        // .dmg's Applications folder instead.
        if (onWindows) {
            command += ['--type', 'msi', '--win-menu', '--win-shortcut']
        } else if (!onMac) {
            command += ['--linux-shortcut']
        }
        commandLine command
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Implementation-Version': resolvedVersion
        )
    }
}

/* Run CardCatalog task -- lists available SlotCard peripheral types.
 *
 * Modeled directly on selenium-grid-manager's runGrid task
 * (github.com/sbabcoc/selenium-grid-manager, grid.gradle): a JavaExec
 * task whose classpath is assembled dynamically from a Gradle property,
 * rather than requiring a hand-typed `java -cp` invocation.
 *
 * Usage:
 *   ./gradlew runCardCatalog
 *   ./gradlew runCardCatalog -PpluginsDir=plugins/
 */
tasks.register('runCardCatalog', JavaExec) {
    group = 'Application'
    description = 'List available SlotCard peripheral types, including any plugin jars'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nordstrom.emulator.system.CardCatalog'

    if (project.hasProperty('pluginsDir')) {
        args '--plugins', project.getProperty('pluginsDir')
    }
}

/* Run SlotConfigTemplate task -- generates a one-time starter slot
 * configuration file. See SlotConfigTemplate's own Javadoc for why this
 * is a snapshot, not a live or auto-synced catalog.
 *
 * Usage:
 *   ./gradlew runSlotConfigTemplate
 *   ./gradlew runSlotConfigTemplate -PpluginsDir=plugins/
 *   ./gradlew runSlotConfigTemplate -PoutputFile=slots.ini
 *   ./gradlew runSlotConfigTemplate -PpluginsDir=plugins/ -PoutputFile=slots.ini
 */
tasks.register('runSlotConfigTemplate', JavaExec) {
    group = 'Application'
    description = 'Generate a one-time starter slot configuration file listing available SlotCard peripheral types'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nordstrom.emulator.system.SlotConfigTemplate'

    def taskArgs = []
    if (project.hasProperty('pluginsDir')) {
        taskArgs += ['--plugins', project.getProperty('pluginsDir')]
    }
    if (project.hasProperty('outputFile')) {
        taskArgs += ['--output', project.getProperty('outputFile')]
    }
    args taskArgs
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// PROM/ROM binary assets (system ROMs, P5/P6 disk controller tables) live
// under src/main/resources and are loaded at runtime, not compiled in --
// keeping them out of source control as binaries is a separate decision;
// see .gitignore.

/* Publishing */
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'ReplicApple2Plus'
                groupId = project.group
                artifactId = rootProject.name
                version = resolvedVersion
                packaging = 'jar'
                description = 'A from-scratch Apple II+ emulator, written in Java, prioritizing ' +
                    'hardware fidelity over performance -- verified against real-world reference ' +
                    'test suites rather than taken on faith.'
                url = 'https://github.com/sbabcoc/ReplicApple2Plus'

                scm {
                    connection = 'scm:git:https://github.com/sbabcoc/ReplicApple2Plus.git'
                    developerConnection = 'scm:git:https://github.com/sbabcoc/ReplicApple2Plus.git'
                    url = 'https://github.com/sbabcoc/ReplicApple2Plus/tree/main'
                    tag = 'HEAD'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'scoba'
                        name = 'Scott Babcock'
                        email = 'scoba@hotmail.com'
                    }
                }
            }
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
}

/* Signing */
signing {
    if (project.hasProperty('signing.keyId')) {
        def keyId = project.getProperty('signing.keyId')
        def gpgNode = getMavenServer(keyId)
        def secret = gpgNode?.passphrase

        if (secret) {
            useGpgCmd()
            project.ext.set("signing.gnupg.passphrase", secret)
            project.ext.set("signing.gnupg.arguments", "--batch,--pinentry-mode,loopback")
        }
    }
    sign publishing.publications.mavenJava
}

/* Install alias */
tasks.register('install') {
    dependsOn tasks.named('publishToMavenLocal')
    group = tasks.named('publishToMavenLocal').get().group
    description = "[alias] publish to Maven Local"
}

/* Nexus publishing */
nexusPublishing {
    packageGroup = 'com.nordstrom'
    repositories {
        ossrh {
            def ossrhNode = getMavenServer('ossrh')
            username = ossrhNode?.username
            password = ossrhNode?.password
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/"))
            if (project.hasProperty('ossrhStagingProfileId')) {
                stagingProfileId = ossrhStagingProfileId
            }
        }
    }
}

// ---------------------------------------------------------------------
// Host file transfer card firmware (optional): rebuilds the committed ROM
// image from firmware/hostfiles with the cc65 suite's ca65 and ld65, which
// must be on the PATH. A normal build never needs this -- it uses the
// committed src/main/resources/.../transfer/hostfiles-firmware.rom.
// ---------------------------------------------------------------------
def firmwareDir = layout.projectDirectory.dir('firmware/hostfiles')
def firmwareObject = layout.buildDirectory.file('firmware/hostfiles.o')
def firmwareImage = layout.projectDirectory.file(
    'src/main/resources/com/nordstrom/emulator/transfer/hostfiles-firmware.rom')

tasks.register('assembleHostFilesFirmwareObject', Exec) {
    group = 'firmware'
    description = 'Assembles the host file transfer card firmware with ca65.'
    inputs.file(firmwareDir.file('hostfiles.s'))
    outputs.file(firmwareObject)
    doFirst { firmwareObject.get().asFile.parentFile.mkdirs() }
    commandLine 'ca65', '-o', firmwareObject.get().asFile.path, firmwareDir.file('hostfiles.s').asFile.path
}

tasks.register('assembleHostFilesFirmware', Exec) {
    group = 'firmware'
    description = 'Links the host file transfer card firmware ROM image with ld65.'
    dependsOn 'assembleHostFilesFirmwareObject'
    inputs.file(firmwareDir.file('hostfiles.cfg'))
    inputs.file(firmwareObject)
    outputs.file(firmwareImage)
    commandLine 'ld65', '-C', firmwareDir.file('hostfiles.cfg').asFile.path,
        '-o', firmwareImage.asFile.path, firmwareObject.get().asFile.path
}

// ---------------------------------------------------------------------
// The transfer card's CP/M adapter, XFER (optional): rebuilds the committed
// Intel HEX from firmware/xfer with sjasmplus 1.22.0 or later, which must be
// on the PATH. A normal build never needs this -- it uses the committed
// src/main/resources/.../transfer/xfer.hex, which the card's reader streams.
// ---------------------------------------------------------------------
def xferDir = layout.projectDirectory.dir('firmware/xfer')
def xferHex = layout.projectDirectory.file('src/main/resources/com/nordstrom/emulator/transfer/xfer.hex')

tasks.register('assembleXferAdapter', Exec) {
    group = 'firmware'
    description = 'Assembles the host file transfer card\'s CP/M adapter with sjasmplus.'
    inputs.file(xferDir.file('xfer.asm'))
    outputs.file(xferHex)
    commandLine 'sjasmplus', '--hex=' + xferHex.asFile.path, xferDir.file('xfer.asm').asFile.path
}
