; Controller mapping for ReplicApple2Plus.
;
; This file is the built-in default. To customize, copy it, change what you
; want, and start with:   --input my-input.ini
;
; You only need to include what you want to change. Anything you leave out
; keeps the value shown here. To clear a binding entirely, give it an empty
; value (for example "pad =" under a button).
;
; Section and key names must be written exactly as shown here. Pad input
; names (LEFT_X, RIGHT_TRIGGER, ...) may be in any case. Lists are
; comma-separated.
;
; Pad inputs
;   Axes:     LEFT_X  LEFT_Y  RIGHT_X  RIGHT_Y
;   Buttons:  A  B  X  Y  BACK  GUIDE  START  LEFT_STICK  RIGHT_STICK
;             LEFT_BUMPER  RIGHT_BUMPER  LEFT_TRIGGER  RIGHT_TRIGGER
;             DPAD_UP  DPAD_DOWN  DPAD_LEFT  DPAD_RIGHT  MISC1

[input]
; How far a stick must move from center before it registers, from 0.0 to
; just under 1.0. The remaining travel is rescaled to the full range, so the
; stick still reaches both extremes. Raise this if the paddle drifts at rest.
deadzone = 0.15

; The Apple II joystick is two paddles. Paddle 0 is joystick 1's X (left to
; right) and paddle 1 is its Y (top to bottom). Paddles 2 and 3 are a second
; joystick. Positions run 0 to 255 with 128 at center.
;
;   axis   which stick axis drives this paddle
;   invert true flips the axis, for a pad whose direction is backwards
;   dpad   "low, high": the buttons that push the paddle to 0 and to 255,
;          overriding the stick while held. Leave empty for none.
;
; Unplugged paddles: with no pad connected, every paddle reads 255, exactly
; as on a real Apple II with nothing in the game port. A paddle that has
; neither an axis nor a dpad is also treated as not plugged in and reads 255
; even while a pad is connected. So to make a game see only ONE joystick,
; clear paddles 2 and 3 ("axis =" with "dpad =" left empty).

[paddle0]
axis = LEFT_X
invert = false
dpad = DPAD_LEFT, DPAD_RIGHT

[paddle1]
axis = LEFT_Y
invert = false
dpad = DPAD_UP, DPAD_DOWN

[paddle2]
axis = RIGHT_X
invert = false
dpad =

[paddle3]
axis = RIGHT_Y
invert = false
dpad =

; The Apple II game connector has three pushbuttons. Button 0 is the usual
; fire button. Each is pressed while ANY of the pad buttons listed is held.

[button0]
pad = RIGHT_TRIGGER, A

[button1]
pad = LEFT_TRIGGER, B

[button2]
pad = X
